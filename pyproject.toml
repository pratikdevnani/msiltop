[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msiltop"
version = "0.1.0"
description = "Real-time macOS hardware performance monitoring for Apple Silicon (M1/M2/M3/M4) with AI workload focus - enhanced asitop alternative"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Fluid Inference", email = "dev@fluidinference.com" },
]
keywords = [
    "msiltop", "msiltop", "apple-silicon", "performance", "monitoring", 
    "m1", "m2", "m3", "m4", "macos", "gpu", "cpu", "ane", "neural-engine",
    "asitop", "nvtop", "htop", "system-monitor", "hardware", "realtime",
    "ai", "ml", "machine-learning", "artificial-intelligence", "workload",
    "terminal", "cli", "command-line", "powermetrics", "memory"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Hardware",
    "Topic :: System :: Systems Administration",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.2.0",
    "textual>=3.0.0",
    "textual-plotext>=1.0.0",
    "psutil>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/pratikdevnani/msiltop"
Repository = "https://github.com/pratikdevnani/msiltop"
Issues = "https://github.com/pratikdevnani/msiltop/issues"
Documentation = "https://github.com/pratikdevnani/msiltop#readme"
Changelog = "https://github.com/pratikdevnani/msiltop/releases"

[project.scripts]
msiltop = "msiltop.msiltop:main"

[tool.hatch.build.targets.wheel]
packages = ["msiltop"]

[tool.uv]
dev-dependencies = []

[tool.uv.sources]
